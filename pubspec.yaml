name: studysphere
description: An AI-powered student learning platform with notes, PYQs, community feed, and AI study assistant.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core and Auth
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_app_check: ^0.2.1+11
  google_sign_in: ^6.2.1

  # Database and Storage
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.8
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.9

  # State Management and Navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0

  # AI Integration — Cloud Functions proxy (no API key in Flutter app)
  cloud_functions: ^4.6.6

  # UI and Aesthetics
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0
  intl: ^0.19.0
  
  # PDF and Files
  flutter_pdfview: ^1.3.2
  file_picker: ^8.0.0
  image_picker: ^1.0.4
  path_provider: ^2.1.2
  path: ^1.9.0
  open_file: ^3.3.2
  crypto: ^3.0.3
  uuid: ^4.3.3

  # Social and Utilities
  share_plus: ^7.2.1
  url_launcher: ^6.3.2
  fl_chart: ^0.66.0
  http: ^1.2.1
  carousel_slider: ^5.1.2
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  youtube_explode_dart: ^3.1.0
  youtube_player_iframe: ^5.1.3
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/banners/
    - assets/animations/
    - assets/logo.png
    - assets/splash_logo.png
    - assets/locations.json

flutter_native_splash:
  color: "#7B72E9"
  background_image: "assets/splash_bg.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#7B72E9"
    background_image: "assets/splash_bg.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
